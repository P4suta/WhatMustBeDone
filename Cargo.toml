[workspace]
members = ["crates/core", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "what-must-be-done"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A local backlog for coding agents"

[[bin]]
name = "wmbd"
path = "src/main.rs"

[dependencies]
wmbd-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
redb = "=4.4.0"
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tempfile = "3.27.0"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }

[lints]
workspace = true
